<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D → 도트 스프라이트 변환기</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%236ea8ff'/%3E%3Crect x='4' y='3' width='8' height='4' fill='%23fff'/%3E%3Crect x='3' y='7' width='10' height='6' fill='%231b1e25'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>3D → 도트 스프라이트 변환기</h1>
        <div class="actions" id="topActions"></div>
        <div id="status" role="status"></div>
      </header>
      <aside id="panel"></aside>
      <main>
        <div class="views">
          <section class="view">
            <div class="label"><span id="viewLabel">3D 뷰</span> <small id="viewHint">드래그 회전 · 휠 확대 · 우클릭 이동</small><span class="grow"></span><span class="ctl" id="viewCtl"></span></div>
            <div id="viewport"><canvas id="srcView"></canvas></div>
          </section>
          <section class="view">
            <div class="label">도트 미리보기<span class="grow"></span><span class="ctl" id="pixelCtl"></span></div>
            <div id="pixelWrap"><canvas id="pixel"></canvas></div>
            <div class="foot" id="pixelInfo"></div>
          </section>
        </div>
        <div id="timeline">
          <div class="controls" id="tlControls"></div>
          <div id="strip"></div>
        </div>
      </main>
      <div id="drop">파일을 놓아 불러오기<br /><small>이미지(.png .jpg .gif …)를 놓으면 HD→SD 변환 모드 · .glb · .gltf · .fbx · .obj · .pmx · .pmd (MMD 는 텍스처 폴더째 놓으세요) · .vmd 모션</small></div>
    </div>
    <input type="file" id="fileModel" accept=".glb,.gltf,.fbx,.obj,.pmx,.pmd,.vmd,.bin,.png,.jpg,.jpeg,.webp,.bmp,.tga,.sph,.spa" multiple hidden />
    <input type="file" id="fileImage" accept="image/*,.gif,.png,.jpg,.jpeg,.webp,.bmp" multiple hidden />
    <input type="file" id="fileFolder" webkitdirectory multiple hidden />
    <input type="file" id="fileMotion" accept=".glb,.gltf,.fbx,.vmd" multiple hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
