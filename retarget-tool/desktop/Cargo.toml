[package]
name = "retargettool"
version = "0.1.0"
edition = "2021"
description = "리타깃 툴 — 모델과 모션을 본 대응 후 GLB 로 내보내는 데스크톱 셸"

[dependencies]
wry = "0.55"
tao = "0.35"
rust-embed = "8"
mime_guess = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
