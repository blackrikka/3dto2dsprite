[package]
name = "vfxmaker"
version = "0.1.0"
edition = "2021"
description = "VFX 메이커 — 도트 이펙트 스프라이트 에디터 (데스크톱 셸)"

[dependencies]
wry = "0.55"
tao = "0.35"
rust-embed = "8"
mime_guess = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
